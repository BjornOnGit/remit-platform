syntax = "proto3";

package ledger.v1;

option go_package = "remit-platform/ledger/proto;ledgerpb";

service Ledger {
  rpc CreateWallet(CreateWalletReq) returns (WalletResp);
  rpc GetWallet(GetWalletReq) returns (WalletResp);
  rpc Transfer(TransferReq) returns (TransferResp);
  rpc GetTransaction(GetTransactionReq) returns (TransactionResp);
}

// All money amounts are decimal strings (never floats).

message CreateWalletReq {
  string owner_id = 1;
  string currency_code = 2;
}

message GetWalletReq {
  string id = 1;
}

message WalletResp {
  string id = 1;
  string owner_id = 2;
  string currency_code = 3;
  string balance = 4;
  string created_at = 5;
}

message TransferReq {
  string idempotency_key = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  string amount = 4;
  string currency = 5;
  map<string, string> metadata = 6;
}

message TransferResp {
  TransactionResp transaction = 1;
}

message GetTransactionReq {
  string id = 1;
}

message TransactionResp {
  string id = 1;
  string from_wallet_id = 2;
  string to_wallet_id = 3;
  string amount = 4;
  string currency_from = 5;
  string currency_to = 6;
  string converted_amount = 7;
  string fx_rate = 8;
  string fx_source = 9;
  string fx_timestamp = 10;
  string status = 11;
  string created_at = 12;
}
