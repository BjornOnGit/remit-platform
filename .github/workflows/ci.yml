name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint and test Node services
        run: |
          found=0
          for dir in services/*/; do
            if [ -f "$dir/package.json" ]; then
              found=1
              echo "== $dir"
              (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present)
            fi
          done
          [ "$found" = 0 ] && echo "No Node services yet"
          exit 0

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet and test Go services
        run: |
          found=0
          for dir in services/*/; do
            if [ -f "$dir/go.mod" ]; then
              found=1
              echo "== $dir"
              (cd "$dir" && go vet ./... && go test ./...)
            fi
          done
          [ "$found" = 0 ] && echo "No Go services yet"
          exit 0