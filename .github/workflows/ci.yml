name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint and test Node services
        run: |
          found=0
          for dir in services/*/; do
            if [ -f "$dir/package.json" ]; then
              found=1
              echo "== $dir"
              (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present)
            fi
          done
          [ "$found" = 0 ] && echo "No Node services yet"
          exit 0

  go:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://remit:remit@localhost:5432/remit?sslmode=disable
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remit -d remit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet and test Go services
        run: |
          found=0
          for dir in services/*/; do
            if [ -f "$dir/go.mod" ]; then
              found=1
              echo "== $dir"
              (cd "$dir" && go vet ./... && go test ./...)
            fi
          done
          [ "$found" = 0 ] && echo "No Go services yet"
          exit 0

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end test (whole stack on a throwaway database)
        run: bash scripts/e2e.sh